input:
  label: generate-1
  generate:
    mapping: |
      root = {
        "counter": timestamp_unix_nano(),
        "data": {
          "status": "running",
          "value": random_int()
        },
        "deployment_id": "dep-test-12345",
        "message": "Test message from pipeline"
      }
    interval: 1s
    count: 0
    batch_size: 1
    auto_replay_nacks: true
output:
  label: stdout-1
  stdout:
    codec: lines
